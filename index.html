<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="GPU Learn: منهج إنجليزي كامل لمدة 12 شهر بالعربي، من A1 لحد B2.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>GPU Learn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centred column (max 640px) on a faint circuit-dot ground — sticky stat bar, a winding path of chip-shaped nodes (lessons, stories, AI talks, chests) per unit, fixed tab bar; lessons, stories, talks and onboarding open full-screen */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --sunk:#E6EAF4; --line:#D8DEEC; --ink:#141A2E; --muted:#59627E; --dot:#D3DAEA;
  --brand:#2F55F0; --brand-deep:#1D3BC2; --brand-soft:#E2E8FF;
  --u1:#2F55F0; --u2:#E0661C; --u3:#0B8F84; --u4:#BE3789;
  --sun:#FFB81F; --sun-soft:#FFF1CC; --sun-ink:#7A5200; --flame:#FF7A1A; --heart:#EE3D67; --gem:#139FC4;
  --ok:#23A15D; --ok-soft:#DBF4E6; --ok-ink:#0F6436;
  --bad:#E5484D; --bad-soft:#FDE2E3; --bad-ink:#9E2328;
  --locked:#C8CFDE; --locked-deep:#A6AFC4;
  --screen:#0E1630; --scene-filter:none;
  --f-display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1120; --surface:#161B2D; --sunk:#1F2539; --line:#2A3250; --ink:#E9EDF9; --muted:#9AA4C2; --dot:#1C2238;
  --brand:#5B7BFF; --brand-deep:#3655D6; --brand-soft:#1C2550;
  --u1:#4C6BF5; --u2:#D9672A; --u3:#11998D; --u4:#C24494;
  --sun-soft:#3A2E0E; --sun-ink:#FFD27A;
  --ok:#30BC72; --ok-soft:#122E1F; --ok-ink:#7BE3AA;
  --bad:#F25A5F; --bad-soft:#371518; --bad-ink:#FF9EA1;
  --locked:#353D58; --locked-deep:#272E46; --screen:#070B18; --scene-filter:brightness(.82) saturate(.92); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1120; --surface:#161B2D; --sunk:#1F2539; --line:#2A3250; --ink:#E9EDF9; --muted:#9AA4C2; --dot:#1C2238;
  --brand:#5B7BFF; --brand-deep:#3655D6; --brand-soft:#1C2550;
  --u1:#4C6BF5; --u2:#D9672A; --u3:#11998D; --u4:#C24494;
  --sun-soft:#3A2E0E; --sun-ink:#FFD27A;
  --ok:#30BC72; --ok-soft:#122E1F; --ok-ink:#7BE3AA;
  --bad:#F25A5F; --bad-soft:#371518; --bad-ink:#FF9EA1;
  --locked:#353D58; --locked-deep:#272E46; --screen:#070B18; --scene-filter:brightness(.82) saturate(.92); color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);background-size:22px 22px;color:var(--ink);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
svg{display:block}
h1,h2,h3{text-wrap:balance}
#app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
#main{animation:viewin .3s ease}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font:800 1.25rem/1 var(--f-display);color:var(--ink);direction:ltr}
.brand-mark{width:32px;height:32px;flex:none}
.stats-top{display:flex;gap:2px}
.stat{display:inline-flex;align-items:center;gap:4px;font:800 1.05rem/1 var(--f-display);font-variant-numeric:tabular-nums;padding:6px 8px;border-radius:12px;background:none;border:0;cursor:pointer}
.stat svg{width:22px;height:22px}
.stat.flame{color:var(--flame)} .stat.flame.off{color:var(--locked-deep)}
.stat.gem{color:var(--gem)} .stat.heart{color:var(--heart)}
.stat:hover{background:var(--sunk)}
.stat.bump svg{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.35) rotate(-8deg)}}

/* bottom nav */
.nav{position:fixed;inset:auto 0 0;z-index:25;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;background:none;border:2px solid transparent;color:var(--muted);font:600 .82rem var(--f-body);cursor:pointer;border-radius:14px}
.tab svg{width:26px;height:26px;transition:transform .2s}
.tab[aria-current="page"]{color:var(--brand);background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 35%,transparent)}
.tab[aria-current="page"] svg{transform:translateY(-2px) scale(1.08)}

/* buttons */
.btn{--c:var(--brand);font:800 1.05rem/1.2 var(--f-display);padding:.85rem 1.5rem;border-radius:16px;border:0;background:var(--c);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 68%,#000);cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s;min-width:140px}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 transparent}
.btn:disabled{background:var(--sunk);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--muted);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.wide{width:100%}
.btn-row{display:flex;flex-direction:column;gap:12px;margin-top:20px}

/* characters */
.avc{--s:48px;width:var(--s);height:var(--s);border-radius:50%;background:var(--c,var(--sunk));overflow:hidden;flex:none;display:block}
.avc svg{width:100%;height:100%}
.av .eyes{animation:blink 4.6s infinite;transform-origin:60px 56px}
.av.talking .mouth{animation:talk .2s ease-in-out infinite alternate;transform-origin:60px 69px}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(.55)}to{transform:scaleY(1.7)}}
.bit .bit-body{animation:bob 2.6s ease-in-out infinite}
.bit .eyes{animation:blink 4s infinite;transform-origin:70px 67px}
.bit .led{animation:led 1.8s ease-in-out infinite}
.bit.wave .arm-r{animation:wave .9s ease-in-out 4;transform-origin:112px 74px}
.bit.jump .bit-body{animation:jump .6s ease 2}
.bit.talking .mouth{animation:talk .2s ease-in-out infinite alternate;transform-origin:70px 85px}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes jump{40%{transform:translateY(-14px)}}
@keyframes wave{50%{transform:rotate(-28deg)}}
@keyframes led{50%{opacity:.45}}

/* learn */
.hello{display:flex;align-items:flex-end;gap:12px;margin-top:16px}
.hello .bit{width:84px;flex:none}
.hello-card{flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:20px 20px 20px 6px;padding:12px 14px;position:relative}
.hello-card h3{margin:0;font:800 1.1rem/1.3 var(--f-display)}
.hello-card p{margin:2px 0 8px;color:var(--muted);font-size:.9rem}
.gbar{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .6s ease}
.gnum{display:flex;justify-content:space-between;font:700 .8rem var(--f-body);color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.unit{margin-top:30px}
.unit-head{background:var(--uc);color:#fff;border-radius:20px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 5px 0 color-mix(in srgb,var(--uc) 68%,#000);position:relative;overflow:hidden}
.unit-head::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,transparent 2px 26px),repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 26px);pointer-events:none}
.unit-head>div{min-width:0;position:relative;z-index:1}
.unit-head small{font:700 .8rem var(--f-body);letter-spacing:.04em;opacity:.85}
.unit-head h2{margin:0;font:800 1.4rem/1.25 var(--f-display)}
.unit-head p{margin:2px 0 0;font-size:.92rem;opacity:.9}
.unit-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none;position:relative;z-index:1}
.unit-cast{display:flex;direction:ltr}
.unit-cast .avc{--s:40px;border:3px solid rgba(255,255,255,.55);margin-left:-10px;background:rgba(255,255,255,.2)}
.guide{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:12px;padding:5px 10px;font:700 .85rem var(--f-display);display:flex;gap:6px;align-items:center;cursor:pointer}
.guide svg{width:16px;height:16px}
.path{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:24px 6px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node-wrap.has-bubble{margin-top:34px}
.node-wrap .lbl{font:700 .78rem var(--f-body);color:var(--muted);margin-top:-2px}
.node{--pc:color-mix(in srgb,var(--uc) 68%,#000);position:relative;width:100px;height:94px;background:none;border:0;padding:0;cursor:pointer}
.node::before{content:"";position:absolute;top:26px;bottom:36px;left:3px;right:3px;background:repeating-linear-gradient(to bottom,var(--pc) 0 5px,transparent 5px 11px);border-radius:2px}
.node::after{content:"";position:absolute;left:29px;right:29px;top:1px;bottom:3px;background:repeating-linear-gradient(to left,var(--pc) 0 5px,transparent 5px 11px)}
.chip{position:absolute;inset:10px 12px 20px;border-radius:18px;background:var(--uc);box-shadow:0 8px 0 color-mix(in srgb,var(--uc) 68%,#000);display:grid;place-items:center;color:#fff;z-index:1;transition:transform .1s,box-shadow .1s}
.chip::before{content:"";position:absolute;inset:11px;border:2px solid rgba(255,255,255,.32);border-radius:10px}
.chip svg{width:30px;height:30px;position:relative}
.node:hover .chip{transform:translateY(-2px)}
.node:active .chip{transform:translateY(6px);box-shadow:0 2px 0 color-mix(in srgb,var(--uc) 68%,#000)}
.node.bonus .chip{background:var(--surface);color:var(--uc);border:3px solid var(--uc)}
.node.bonus .chip::before{border-color:color-mix(in srgb,var(--uc) 35%,transparent)}
.node.locked{--uc:var(--locked);--pc:var(--locked)}
.node.locked .chip{color:var(--locked-deep);box-shadow:0 8px 0 var(--locked-deep);background:var(--locked);border:0}
.node.locked .chip::before{border-color:var(--locked-deep);opacity:.5}
.node.opened .chip{opacity:.55}
.node.current .chip{outline:5px solid color-mix(in srgb,var(--uc) 28%,transparent);outline-offset:6px;animation:pulse 1.8s ease-in-out infinite}
.bubble{position:absolute;top:-38px;background:var(--surface);color:var(--uc);border:2px solid var(--line);font:800 1rem/1 var(--f-display);padding:8px 16px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;z-index:2}
.bubble::after{content:"";position:absolute;bottom:-8px;left:50%;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes pulse{50%{outline-offset:10px;outline-color:color-mix(in srgb,var(--uc) 12%,transparent)}}
.done-all{margin-top:30px;text-align:center;padding:24px;border:2px dashed var(--line);border-radius:20px;color:var(--muted);background:var(--surface)}

/* section titles and cards */
.h{font:800 1.6rem/1.3 var(--f-display);margin:22px 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.h2{font:800 1.2rem/1.3 var(--f-display);margin:28px 0 12px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px}
.pcards{display:grid;gap:12px}
.pcard{display:flex;align-items:center;gap:14px;text-align:start;width:100%;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:20px;padding:14px 16px;cursor:pointer}
.pcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pcard:disabled{cursor:not-allowed;opacity:.6}
.pcard .ic{flex:none;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;color:#fff;background:var(--c)}
.pcard .ic svg{width:28px;height:28px}
.pcard .ic.bitic{background:var(--brand-soft);padding:2px}
.pcard .ic.bitic svg{width:48px;height:48px}
.pcard>div{min-width:0}
.pcard h3{margin:0;font:800 1.08rem/1.3 var(--f-display)}
.pcard p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.pcard .badge{margin-inline-start:auto;flex:none;font:800 .95rem var(--f-display);color:var(--bad-ink);background:var(--bad-soft);border-radius:10px;padding:2px 10px;font-variant-numeric:tabular-nums}
.pcard .badge.new{color:var(--brand);background:var(--brand-soft)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.word{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 10px;min-width:0}
.word .e{font-size:1.5rem;flex:none}
.word>div{min-width:0;flex:1}
.word b{display:block;font:700 1rem/1.2 var(--f-body);direction:ltr;text-align:right;overflow-wrap:anywhere}
.word span{display:block;color:var(--muted);font-size:.85rem}
.mini-say{flex:none;width:32px;height:32px;border-radius:10px;border:0;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;cursor:pointer}
.mini-say svg{width:18px;height:18px}
.empty{text-align:center;padding:28px 18px;border:2px dashed var(--line);border-radius:20px;color:var(--muted);background:var(--surface)}
.empty .bit{width:110px;margin:0 auto 6px}
.empty h3{color:var(--ink);font:800 1.15rem var(--f-display);margin:0 0 4px}

/* league */
.league-head{display:flex;align-items:center;gap:14px}
.league-badge{width:64px;height:64px;border-radius:18px;background:#C98A4B;color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 #8E5A27;flex:none}
.league-badge svg{width:34px;height:34px}
.lrows{display:grid;gap:4px;margin-top:16px}
.lrow{display:grid;grid-template-columns:30px 40px 1fr auto;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface)}
.lrow .rk{font:800 1.05rem var(--f-display);text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.lrow.top .rk{color:var(--ok)}
.lrow .av0{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 1.1rem var(--f-display);background:var(--c)}
.lrow .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .xp{font:700 .95rem var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr}
.lrow.me{background:var(--brand-soft)}
.lrow.me .nm{color:var(--brand);font-weight:800}
.zone{font:700 .8rem var(--f-body);letter-spacing:.03em;padding:8px 12px;border-radius:10px;text-align:center}
.zone.up{color:var(--ok-ink);background:var(--ok-soft)}
.zone.down{color:var(--bad-ink);background:var(--bad-soft)}
.note{color:var(--muted);font-size:.85rem;margin-top:14px}

/* profile */
.prof{display:flex;align-items:center;gap:16px;margin-top:20px}
.avatar{width:76px;height:76px;flex:none;border-radius:22px;background:var(--brand);color:#fff;display:grid;place-items:center;font:800 2rem var(--f-display);box-shadow:0 5px 0 var(--brand-deep)}
.prof>div{min-width:0;flex:1}
.name-in{width:100%;font:800 1.35rem var(--f-display);color:var(--ink);background:transparent;border:0;border-bottom:2px dashed var(--line);padding:2px 0}
.name-in:focus{outline:none;border-bottom-color:var(--brand)}
.prof p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.st{border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;background:var(--surface);min-width:0}
.st svg{width:26px;height:26px;flex:none;color:var(--c)}
.st b{display:block;font:800 1.3rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.st span{display:block;color:var(--muted);font-size:.85rem}
.plot{position:relative;height:150px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;border-bottom:2px solid var(--line);padding-top:10px}
.pcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.pcol em{font:700 .78rem var(--f-body);font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.pcol i{display:block;width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--brand);min-height:3px}
.pcol i.hit{background:var(--sun)}
.pcol.today em{color:var(--ink)}
.goal-line{position:absolute;left:0;right:0;border-top:2px dashed var(--sun);pointer-events:none}
.goal-line span{position:absolute;top:-22px;left:0;font:700 .75rem var(--f-body);color:var(--muted);background:var(--surface);padding:0 4px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px;text-align:center;color:var(--muted);font-size:.78rem}
.days .today{color:var(--ink);font-weight:700}
.legend{display:flex;gap:16px;margin-top:10px;color:var(--muted);font-size:.82rem;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.seg button b{display:block;font:800 1.1rem var(--f-display);font-variant-numeric:tabular-nums}
.seg button span{display:block;font-size:.78rem;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 3px 0 var(--brand)}
.ach{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:2px solid var(--line)}
.ach:last-child{border-bottom:0}
.ach .bdg{width:50px;height:50px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 68%,#000)}
.ach.no .bdg{background:var(--locked);color:var(--locked-deep);box-shadow:0 4px 0 var(--locked-deep)}
.ach .bdg svg{width:26px;height:26px}
.ach>div{flex:1;min-width:0}
.ach h4{margin:0;font:800 1rem var(--f-display)}
.ach p{margin:0;color:var(--muted);font-size:.85rem}
.pbar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.ach small{font:700 .8rem var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--line)}
.setrow:last-child{border-bottom:0}
.switch{width:52px;height:30px;border-radius:99px;background:var(--locked);border:0;position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .15s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{right:26px}
.linkbtn{background:none;border:0;color:var(--brand);font:700 .95rem var(--f-body);cursor:pointer;padding:6px 0}

.lfoot{border-top:2px solid var(--line);background:var(--bg);padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:background .2s}

.tag{display:inline-flex;align-items:center;gap:6px;font:700 .82rem var(--f-body);color:var(--u4);margin-bottom:6px}

.typein{width:100%;font:600 1.25rem var(--f-body);padding:16px 18px;border:2px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);text-align:left;min-height:110px;resize:none}

.month-card p{margin:2px 0 8px;color:var(--muted);font-size:.9rem}
.today{margin-top:14px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px}

.today h3 small{font:700 .8rem var(--f-body);color:var(--muted)}
.trow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:2px solid var(--line)}
.today h3+.trow{border-top:0}
.trow .ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--c)}
.trow .ic svg{width:20px;height:20px}
.trow>div{flex:1;min-width:0}
.trow b{display:block;font-weight:700}
.trow span{color:var(--muted);font-size:.85rem}
.trow.sdone{opacity:.6}
.trow.sdone b{text-decoration:line-through}
.btn.go{flex:none;min-width:0;padding:.5rem 1rem;font-size:.95rem}
.gchip{display:inline-block;margin-top:6px;background:rgba(255,255,255,.18);border-radius:8px;padding:2px 8px;font:600 .8rem var(--f-body)}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--brand);margin:0 4px;color:var(--brand);text-align:center}
.gram{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.gram h3{margin:0 0 6px;font:800 1.2rem var(--f-display);color:var(--brand)}
.gram p{margin:0 0 12px;line-height:1.85}
.gex{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px dashed var(--line)}
.gex>div{flex:1;min-width:0}
.gex b{display:block;direction:ltr;text-align:left;font-weight:600}
.gex span{color:var(--muted);font-size:.9rem}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:end;margin:14px 0 4px}
.rung{border-radius:12px 12px 4px 4px;background:var(--sunk);color:var(--muted);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:8px 4px;font:800 1.15rem var(--f-display)}

.skill span{font-weight:600}

.skill .pbar{margin:0;height:12px}
.skill .pbar i{background:var(--c)}
.cando{display:flex;gap:10px;align-items:flex-start;padding:7px 0;color:var(--muted)}
.cando i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-top:2px}
.cando i svg{width:14px;height:14px}
.cando.ok{color:var(--ink)}
.cando.ok i{background:var(--ok);border-color:var(--ok);color:#fff}
.tests{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.tbox{border:2px solid var(--line);border-radius:10px;text-align:center;padding:4px 2px;background:var(--surface)}
.tbox b{display:block;font:800 .85rem var(--f-display);color:var(--muted)}
.tbox span{font:700 .78rem var(--f-body);font-variant-numeric:tabular-nums}
.tbox.pass{border-color:var(--ok);background:var(--ok-soft)}
.tbox.pass span{color:var(--ok-ink)}
.method{display:grid;gap:10px}
.mth{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.mth .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--c)}
.mth .ic svg{width:22px;height:22px}
.mth>div{min-width:0}
.mth b{display:block;font:800 1rem var(--f-display)}
.mth p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.mth small{display:block;color:var(--muted);font-size:.78rem;margin-top:4px;font-style:italic}
.cert{border:3px solid var(--sun);border-radius:20px;padding:20px;text-align:center;background:var(--surface);margin-top:20px;box-shadow:0 0 0 6px var(--sun-soft)}
.cert small{display:block;font:700 .8rem var(--f-body);letter-spacing:.08em;color:var(--sun-ink)}
.cert h2{margin:6px 0;font:800 1.6rem var(--f-display)}
.cert .lv{font:800 2.6rem/1 var(--f-display);color:var(--brand)}
.cert p{color:var(--muted);font-size:.85rem;margin:8px 0 0}
.chatters{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.chatter{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:18px;cursor:pointer;text-align:center}
.chatter:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.chatter:disabled{opacity:.55;cursor:not-allowed}
.chatter b{font:800 1rem var(--f-display)}
.chatter span{font-size:.75rem;color:var(--muted);line-height:1.3}
.talk-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;max-width:760px;margin-inline:auto}
.talk-tools .note{margin:0}
.btn.end{min-width:0;padding:.5rem 1rem;font-size:.92rem}
@media (max-width:420px){.ex-title{font-size:1.3rem}.pic{width:76px;height:76px;font-size:2.5rem}.prompt .bit{width:76px}.btn{min-width:0;flex:1}.tiles{gap:8px}.actor{width:104px}.hero h1{font-size:1.9rem}.unit-cast{display:none}}

function confetti(){

  const c=$('#fx'),x=c.getContext('2d'),dpr=window.devicePixelRatio||1;
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.scale(dpr,dpr);
  const cols=['#2F55F0','#FFB81F','#23A15D','#EE3D67','#139FC4','#E0661C'];
  const P=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,s:Math.random()*7+5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:rnd(cols),sq:Math.random()<.5}));
  const t0=performance.now();
  (function f(t){const k=(t-t0)/1000;x.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{p.vy+=.38;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-k/2.4);x.fillStyle=p.c;
      if(p.sq)x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else{x.beginPath();x.arc(0,0,p.s/2.6,0,7);x.fill()}x.restore()});
    if(k<2.4)requestAnimationFrame(f);else x.clearRect(0,0,innerWidth,innerHeight)})(t0);
}

}
const options=(ans,pool)=>shuffle([ans].concat(pool.slice(0,3)));
const mk={
  intro:ws=>({t:'intro',ws}),

  toEn:w=>({t:'toEn',w,opts:options(w.en,poolFor(w,'en'))}),
  toAr:w=>({t:'toAr',w,opts:options(w.ar,poolFor(w,'ar'))}),
  listen:w=>canSpeak()?({t:'listen',w,opts:options(w.en,poolFor(w,'en'))}):mk.toEn(w),
  type:w=>({t:'type',w}),
  match:ws=>({t:'match',ws,arO:shuffle([0,1,2,3]),enO:shuffle([0,1,2,3])}),
  build:(s,l)=>{const ans=tokEn(s.en);const set=new Set(ans.map(normEn));

    const extra=shuffle(uniq(l.sents.filter(x=>x!==s).flatMap(x=>tokAr(x.ar))).filter(t=>!set.has(normAr(t)))).slice(0,3);

};

    return [mk.gram(w),mk.gap(w.gap[0]),mk.gap(w.gap[1]),mk.build(ex[0],ws),mk.gap(w.gap[2]),mk.buildAr(ex[1],ws),mk.build(ex[2]||ex[0],ws),mk.buildAr(ex[0],ws),mk.gap(w.gap[1]),mk.build(ex[1],ws),mk.gap(w.gap[0]),mk.buildAr(ex[2]||ex[1],ws)]}
  const w=l.words,s=l.sents,out=[
    mk.intro(w.slice(0,4)),mk.toEn(w[0]),mk.toAr(w[1]),mk.listen(w[2]),mk.toEn(w[3]),mk.match(w.slice(0,4)),
    mk.intro(w.slice(4,8)),mk.toEn(w[4]),mk.toAr(w[5]),mk.listen(w[6]),mk.toAr(w[7]),mk.match(w.slice(4,8)),

  if(l.prev){const p=l.prev.words;out.push(mk.toAr(p[0]),mk.type(p[4]),mk.match([w[0],w[4],p[1],p[5]]))}else out.push(mk.toAr(w[3]),mk.toEn(w[7]));

/* ---------- daily guided session (40–60 minutes) ---------- */
let PENDING=null,GOALJUST=false;

const SI={review:I.refresh,new:I.star,practice:I.ear,talk:I.talk};
function plan(){
  const t=today();
  if(S.plan&&S.plan.d===t&&S.plan.g===S.goal)return S.plan;
  const keep=S.plan&&S.plan.d===t?S.plan.steps.filter(x=>x.done):[];
  const many=learnedWords().length>=4,steps=[];
  if(many)steps.push({k:'review',min:8});
  steps.push({k:'new',min:14});
  if(S.goal>=50||!many)steps.push({k:'new',min:10});
  if(many)steps.push({k:'practice',min:8,mode:new Date().getDay()%2?'listen':'quick'});
  const used=steps.reduce((a,x)=>a+x.min,0);
  steps.push({k:'talk',min:Math.max(12,S.goal-used)});
  keep.forEach(d=>{const m=steps.find(x=>x.k===d.k&&!x.done);if(m)m.done=true});
  S.plan={d:t,g:S.goal,steps};save();return S.plan;
}
const todayMins=()=>Math.round(S.mins[today()]||0);

  const t=today(),before=S.mins[t]||0;S.mins[t]=before+x;
  const keep=new Set(Array.from({length:30},(_,i)=>dayKey(-i)));Object.keys(S.mins).forEach(k=>{if(!keep.has(k))delete S.mins[k]});

  if(s.k==='new'){const k=p.steps.slice(0,i).filter(x=>x.k==='new'&&!x.done).length,f=firstReq();
    if(f===-1)return ['درس إضافي','خلّصت المنهج، هذا تمرين'];

/* ---------- AI talk engine (open-ended: only the learner ends it) ---------- */
function talkRules(tk){
  const C=CH[tk.who];
  const goals=tk.goals.length?`Some ideas the learner may want to practise here (numbered 1-${tk.goals.length}):\n${tk.goals.map((g,i)=>`${i+1}. ${g[0]}`).join('\n')}\nGive the learner natural chances to do them, but always follow the learner if they change topic. Mark an idea done only when the learner's own message achieves it.`:`There are no fixed tasks: follow the learner's interests.`;
  return `You are role-playing ${C.en} in this scene: ${tk.scene}. The learner is an Iraqi Arabic speaker practising English. Match their level: keep your English simple (A1-A2) when their messages are simple, and use richer English when they write well.
Stay in character as a real person with your own life, opinions and stories. The conversation is open-ended and never ends on its own: never say goodbye or wrap up unless the learner clearly says goodbye first, and even then you may warmly invite them to keep talking. Always keep it going: react to what they said, share a little about yourself, and ask one follow-up question. Any topic is welcome.
Write 1-3 short, natural sentences per reply.
${goals}
If the learner's last message has a real English mistake (ignore capitalization and punctuation), give a correction. If they write in Arabic, reply in character in English and use the correction to show how to say their message in English.
Respond ONLY with JSON of this shape:
{"reply":"your in-character English reply","reply_ar":"translation of your reply into Iraqi Arabic","correction":null or {"fixed":"the learner's message in correct English","note_ar":"one short explanation in Arabic"},"goals_done":[numbers of the ideas done so far],"suggestions":[{"en":"a short reply the learner could send next","ar":"its Arabic meaning"},{"en":"another option","ar":"its meaning"}]}`;
}
function startTalk(tk){
  L={kind:'talk',tk,turns:[],goals:new Set(),userTurns:0,fixes:0,start:Date.now(),done:0,total:Math.max(1,tk.goals.length),busy:false,opening:tk.open||null,sugs:tk.open?tk.open.suggestions:[]};
  openPlayer();renderTalk();
  if(!L.opening&&SAMPLE)talkOpen();
}
function showTyping(){const c=$('#chat');if(!c)return;c.insertAdjacentHTML('beforeend',`<div class="msg" id="typing">${avc(L.tk.who,40)}<div class="bub"><span class="typing"><span></span><span></span><span></span></span></div></div>`);scrollChat()}
function hideTyping(){const t=$('#typing');t&&t.remove()}
const AIERR={not_granted:'ما سمحت للموقع يستخدم Claude، فالمحادثة متوقفة. تگدر تسمحله من قائمة الأذونات بالصفحة.',rate_limited:'رسائل هواية ورا بعض. استنى دقيقة وجرّب مرة ثانية.',sampling_disabled:'المحادثة الذكية مطفّية بهذا الحساب.',capability_disabled:'المحادثة الذكية مطفّية بهذا الحساب.',session_expired:'انتهت الجلسة. حدّث الصفحة وجرّب.',invalid_json:'الرد وصل بشكل غلط. جرّب مرة ثانية.'};
async function talkOpen(){
  const cur=L;if(!cur||cur.busy||!SAMPLE)return;cur.busy=true;
  $$('#chat .sysmsg').forEach(x=>x.remove());showTyping();renderTalkFoot();
  cur.ctl=new AbortController();
  try{
    const r=await SAMPLE.json([{role:'user',content:talkRules(cur.tk)+'\n\nBegin the scene with your first line. Use goals_done [] and correction null.'}],{modelTier:'quick',cache:false,signal:cur.ctl.signal});
    if(L!==cur)return;hideTyping();
    if(!r||typeof r.reply!=='string')throw {code:'invalid_json'};

    if(code==='not_granted'||code==='sampling_disabled'||code==='capability_disabled')SAMPLE=null;
  }

function renderTalk(keep){

  renderTalkFoot();talkBar();setHearts();
}
function talkBar(){setBar(L.tk.goals.length?L.goals.size/L.tk.goals.length*100:Math.min(100,L.userTurns*10))}

function renderTalkFoot(){

    ${L.sugs&&L.sugs.length?`<div class="sugs">${L.sugs.slice(0,3).map((s,i)=>`<button class="sg" data-act="sug" data-i="${i}"><b>${esc(s.en)}</b><span>${esc(s.ar)}</span></button>`).join('')}</div>`:''}
    <div class="tbar">${DICT?`<button class="rbtn mic ${L.mic?'on':''}" id="micBtn" data-act="mic" aria-label="احچي بالمايك">${I.mic}</button>`:''}
    <textarea id="tin" class="tin" rows="1" lang="en" placeholder="اكتب بالإنجليزي..." aria-label="رسالتك" ${L.busy||!L.opening?'disabled':''}></textarea>

}
function syncSend(){const t=$('#tin'),b=$('#sendBtn');if(t&&b)b.disabled=L.busy||!L.opening||!t.value.trim()}
function addMsg(who,en,ar,first){
  const c=$('#chat');if(!c)return;
  if(who==='me')c.insertAdjacentHTML('beforeend',`<div class="msg me"><div class="bub">${esc(en)}</div></div>`);
  else{c.insertAdjacentHTML('beforeend',`<div class="msg">${avc(who,40)}<div class="bub"><div class="who" style="display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 .8rem var(--f-body);color:var(--muted)"><span>${CH[who].name}</span><button class="mini-say" data-act="say" data-t="${esc(en)}" data-who="${who}" aria-label="اسمع">${I.speaker}</button></div><div class="en" style="font:600 1.08rem/1.45 var(--f-body);direction:ltr;text-align:left">${esc(en)}</div>${ar?`<div class="ar" style="color:var(--muted);font-size:.9rem">${esc(ar)}</div>`:''}</div></div>`);
    if(!first)speak(en,{who});}
  scrollChat();
}
function scrollChat(){const b=$('#lbody');requestAnimationFrame(()=>b.scrollTo({top:b.scrollHeight,behavior:reduced?'auto':'smooth'}))}
async function sendTalk(text){
  text=(text||'').trim();if(!text||!L||L.busy||!SAMPLE||!L.opening)return;
  if(L.mic&&DICT){try{await DICT.stop()}catch(e){}}
  L.micBase='';L.busy=true;
  addMsg('me',text);L.turns.push({role:'user',content:text});
  showTyping();renderTalkFoot();
  const tk=L.tk,hist=[{role:'user',content:talkRules(tk)+'\n\nBegin the scene with your first line.'},{role:'assistant',content:JSON.stringify(L.opening)}];
  let recent=L.turns.slice(-21);if(recent[0]&&recent[0].role!=='user')recent=recent.slice(1);
  const cur=L;cur.ctl=new AbortController();
  try{
    const r=await SAMPLE.json(hist.concat(recent),{modelTier:'quick',cache:false,signal:cur.ctl.signal});
    if(L!==cur)return;
    hideTyping();
    if(!r||typeof r.reply!=='string')throw {code:'invalid_json'};

    }
    addMsg(tk.who,r.reply,r.reply_ar);
    const before=L.goals.size;
    (Array.isArray(r.goals_done)?r.goals_done:[]).forEach(n=>{n=+n;if(n>=1&&n<=tk.goals.length)L.goals.add(n)});

  }catch(e){
    if(L!==cur)return;

    L.turns.pop();const lm=$$('#chat .msg.me').pop();lm&&lm.remove();
    const code=e&&e.code;

    L.busy=false;renderTalkFoot();const tin=$('#tin');if(tin){tin.value=text;syncSend()}
    if(!SAMPLE)renderTalk(true);

  }
  L.busy=false;renderTalkFoot();const tin=$('#tin');if(tin)tin.focus();
}

     </div>`;

function placedUnit(){if(O.test!=='done')return 0;let u=0;for(let i=0;i<3;i++){if(O.score[i]>=2)u=i+1;else break}return u}
function finishOnb(){
  const fresh=!S.onboarded;
  S.onboarded=true;S.why=O.why;S.level=O.level;S.goal=O.goal;S.name=O.name.trim().slice(0,24);
  const u=placedUnit();
  S.startLvl=u;if(u>0){WEEKS.filter(w=>w.mi<u*3).forEach(w=>w.nodes.forEach(n=>{if(n.k!=='talk')S.done[n.ref.id]=S.done[n.ref.id]||1}));for(let i=0;i<u*3;i++)S.done['m'+(i+1)]=S.done['m'+(i+1)]||1}MSEL=null;
  save();$('#onb').hidden=true;document.body.style.overflow='';O=null;TAB='learn';render();window.scrollTo(0,0);
  if(fresh){const pos=$('.node.current');pos&&pos.scrollIntoView({block:'center',behavior:reduced?'auto':'smooth'})}
}

};
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  const a=e.target.closest('[data-act]');if(!a||a.disabled)return;
  const f=ACT[a.dataset.act];if(f)f(a,e);
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='typein'){const b=$('#checkBtn');if(b)b.disabled=!e.target.value.trim()}
  if(id==='tin'){if(L&&!L.mic)L.micBase=e.target.value;syncSend();e.target.style.height='auto';e.target.style.height=Math.min(140,e.target.scrollHeight)+'px'}
  if(id==='nameIn'){S.name=e.target.value.slice(0,24);save();renderTop();const av=$('.avatar');if(av)av.textContent=myName().charAt(0)}
  if(id==='onbName'){O.name=e.target.value;const b=$('#onbNameBtn');if(b)b.disabled=!O.name.trim()}
});
document.addEventListener('keydown',e=>{
  if(!$('#sheet').hidden){if(e.key==='Escape')closeSheet();return}
  if(!$('#onb').hidden){if(e.key==='Enter'&&e.target.id==='onbName'&&O.name.trim()){e.preventDefault();ACT.onbNext()}return}
  if(!L||$('#lesson').hidden)return;
  if(e.key==='Escape'){ACT.quit();return}
  if(L.kind==='talk'){if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='tin'){e.preventDefault();sendTalk(e.target.value)}return}
  if(e.key==='Enter'){e.preventDefault();const b=$('#lfoot .btn:not(.ghost)');if(b&&!b.disabled)b.click();return}
  if(L.phase==='answer'&&/^[1-4]$/.test(e.key)&&document.activeElement?.id!=='typein'){const o=$$('#lbody .opt')[+e.key-1];o&&o.click()}
});
if(canWebSpeak){try{speechSynthesis.getVoices()}catch(e){}}
setInterval(()=>{const el=$('#ttime');if(el&&L&&L.kind==='talk'){const m=Math.floor((Date.now()-L.start)/60000);el.textContent=L.target?(m>=L.target?` · ⏱ ${m} د: وصلت لوقتها، كمّل إذا تحب`:` · ⏱ ${m} / ${L.target} د`):` · ⏱ ${m} د`}},10000);
setInterval(()=>{const h=S.hearts;regen();if(S.hearts!==h&&!L)renderTop()},60000);
render();
if(!S.onboarded)startOnb();
})();
</script>

</body>
</html>
